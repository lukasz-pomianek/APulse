[versions]
agp = "9.1.0"
kotlin = "2.3.10"
compose-bom = "2026.03.00"
hilt = "2.59.2"
ksp = "2.3.6"
ktor = "3.4.1"

[libraries]
# AndroidX
androidx-core-ktx = "androidx.core:core-ktx:1.18.0"
androidx-lifecycle-runtime = "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
androidx-lifecycle-viewmodel-compose = "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
androidx-activity-compose = "androidx.activity:activity-compose:1.13.0"
androidx-navigation-compose = "androidx.navigation:navigation-compose:2.9.7"
androidx-room-runtime = "androidx.room:room-runtime:2.8.4"
androidx-room-ktx = "androidx.room:room-ktx:2.8.4"
androidx-room-compiler = "androidx.room:room-compiler:2.8.4"
androidx-room-testing = "androidx.room:room-testing:2.8.4"
androidx-hilt-navigation-compose = "androidx.hilt:hilt-navigation-compose:1.3.0"
androidx-documentfile = "androidx.documentfile:documentfile:1.1.0"
androidx-security-crypto = "androidx.security:security-crypto:1.1.0"
androidx-junit = "androidx.test.ext:junit:1.3.0"
androidx-espresso-core = "androidx.test.espresso:espresso-core:3.7.0"

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = "androidx.compose.material3:material3:1.4.0"
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-gradle-plugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }

# Networking
okhttp = "com.squareup.okhttp3:okhttp:5.3.2"
okhttp-logging-interceptor = "com.squareup.okhttp3:logging-interceptor:5.3.2"
retrofit = "com.squareup.retrofit2:retrofit:3.0.0"
retrofit-kotlin-serialization = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0"

# Kotlin
kotlinx-serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0"
kotlinx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
kotlinx-coroutines-test = "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
kotlinx-datetime = "org.jetbrains.kotlinx:kotlinx-datetime:0.7.1"

# Ktor
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }

# Other
gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
junit = "junit:junit:4.13.2"
mockito-core = "org.mockito:mockito-core:5.23.0"
error-prone-annotations = "com.google.errorprone:error_prone_annotations:2.48.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
