import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

android {
    namespace 'com.apulse.core'
    compileSdk 36

    defaultConfig {
        minSdk 24
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    // Android Core (minimal dependencies for core module)
    implementation libs.androidx.core.ktx
    
    // Networking - the only required dependency for the API
    api libs.okhttp
    
    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}

publishing {
    publications {
        release(MavenPublication) {
            artifactId = 'apulse-core'

            afterEvaluate {
                from components.release
            }
            
            pom {
                name = 'APulse Core'
                description = 'Lightweight core library for APulse network debugging tool'
                url = 'https://github.com/lukasz-pomianek/APulse'
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                
                developers {
                    developer {
                        id = 'lukasz-pomianek'
                        name = 'Łukasz Pomianek'
                        url = 'https://github.com/lukasz-pomianek'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/lukasz-pomianek/APulse.git'
                    developerConnection = 'scm:git:ssh://git@github.com/lukasz-pomianek/APulse.git'
                    url = 'https://github.com/lukasz-pomianek/APulse'
                }
            }
        }
    }
}